definitions:
  DateTime:
    $id: '#/definitions/DateTime'
    type: string
    format: date-time
  QualifiedName:
    $id: '#/definitions/QualifiedName'
    type: string
    title: The QualifiedName Schema
    default: ''
    pattern: (^[A-Za-z0-9_]+:)?(.*)$
  QualifiedName+:
    $id: '#/definitions/QualifiedName+'
    oneOf:
    - $ref: '#/definitions/QualifiedName'
    - type: array
      items:
        $ref: '#/definitions/QualifiedName'
  non_prov_properties:
    $id: '#/definitions/non_prov_properties'
    patternProperties:
      ^[A-Za-z0-9_]+:(.*)$: {}
  typed_value:
    type: object
    required:
    - '@value'
    - '@type'
    properties:
      '@value':
        type: string
      '@type':
        type: string
    additionalProperties: false
  lang_string:
    type: object
    required:
    - '@value'
    properties:
      '@value':
        type: string
      '@language':
        type: string
    additionalProperties: false
  ArrayOfValues:
    $id: '#/definitions/ArrayOfValues'
    type: array
    items:
      anyOf:
      - $ref: '#/definitions/QualifiedName'
      - $ref: '#/definitions/typed_value'
      - $ref: '#/definitions/lang_string'
  ArrayOfLabelValues:
    $id: '#/definitions/ArrayOfLabelValues'
    type: array
    items:
      $ref: '#/definitions/lang_string'
  Context:
    $id: '#/definitions/Context'
    type: array
    title: The @context Schema
    items:
      oneOf:
      - type: string
        format: uri
      - type: object
        title: The Items Schema
        additionalProperties:
          type: string
  prov:StatementOrBundle:
